name: SRE Agent fix (opencode)

on:
  workflow_call:
    inputs:
      model:
        description: "provider/model, for example openrouter/deepseek/deepseek-v4-pro or anthropic/claude-sonnet-4-5. The provider prefix chooses the variable that receives provider_key."
        required: true
        type: string
      prompt:
        description: "An instruction that replaces the comment. Empty for the comment door: the action reads the comment and the issue itself."
        required: false
        type: string
        default: ""
      issue_number:
        description: "The tracking issue this run answers. The relay in the caller workflow sets it, because a workflow_dispatch payload carries no issue; a comment-started run leaves it empty and the event carries the issue."
        required: false
        type: string
        default: ""
      comment_id:
        description: "The comment the relay answered, so the run can react to it. Empty on a comment-started run, which the action reacts to itself."
        required: false
        type: string
        default: ""
      agent:
        description: "The primary agent opencode runs, set as its default_agent."
        required: false
        type: string
        default: sre-fix
      variant:
        description: "The provider's reasoning effort, for example high."
        required: false
        type: string
        default: ""
      use_github_token:
        description: "Act as github-actions[bot] with GITHUB_TOKEN instead of the opencode App. Pull requests it opens do not start your other workflows."
        required: false
        type: boolean
        default: false
      runner:
        description: "The runs-on label."
        required: false
        type: string
        default: ubuntu-latest
      timeout_minutes:
        description: "The job's time bound in minutes."
        required: false
        type: number
        default: 30
      dry_run:
        description: "Install the configuration and map the provider secret, then stop. The package's own CI uses it."
        required: false
        type: boolean
        default: false
    secrets:
      provider_key:
        description: "The provider API key."
        required: true
      # Not github_token: GitHub reserves that name inside workflow_call.
      token:
        description: "A token to use in place of GITHUB_TOKEN when use_github_token is set."
        required: false

jobs:
  fix:
    name: opencode fix
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # One run per issue at a time: a second comment while the first run is
    # still open would otherwise race it on the same issue. A concurrency
    # group cannot read env, so the resolver below is written out again here.
    concurrency:
      group: sre-agent-opencode-${{ github.repository }}-${{ inputs.issue_number != '' && inputs.issue_number || github.event.issue.number || github.run_id }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    env:
      # The issue this run answers, from whichever door started it: the relay
      # passes it as an input because a workflow_dispatch payload has no issue
      # in it, and a comment carries it in the event. Every step below reads
      # this one value, so the two doors cannot drift apart.
      ISSUE_NUMBER: ${{ inputs.issue_number != '' && inputs.issue_number || github.event.issue.number }}
    steps:
      # The relay job holds actions: write and nothing else, so it cannot
      # react to the comment it relayed, and on this door the action reacts to
      # nothing: a workflow_dispatch run has no comment in its event. The
      # reaction is what tells the person watching the issue that the request
      # was picked up.
      - name: React to the comment the relay answered
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.comment_id != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ inputs.comment_id }}
        run: |
          set -euo pipefail
          if [[ ! "$COMMENT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::comment_id must be a number; this run was dispatched with '${COMMENT_ID}'"
            exit 1
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" \
            -f content=rocket > /dev/null \
            || echo "::warning::could not react to comment ${COMMENT_ID}; the run itself is unaffected"

      # In App mode the action sets its own push credential and identity, so
      # the checkout keeps none. In token mode the action pushes with whatever
      # git holds, so the checkout keeps the token the pull request is opened
      # with.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.token || github.token }}
          persist-credentials: ${{ inputs.use_github_token }}

      # The package's own files, at the commit this workflow was called at,
      # so the fences and the agent always match the workflow that runs them
      # and nothing has to be committed in the caller's repository. The
      # configuration travels through OPENCODE_CONFIG_CONTENT, which opencode
      # merges after the repository's own opencode.json, so the fences win;
      # only the agent file is written into the checkout, and it is excluded
      # from git because the action stages the whole tree with "git add .".
      - name: Install the SRE Agent opencode configuration
        shell: bash
        env:
          # job.workflow_sha is the called workflow's commit (github.job_workflow_sha
          # is never set in a called workflow). actionlint's job context type
          # predates the property, so it is read out of the serialized context.
          JOB_CONTEXT: ${{ toJSON(job) }}
          AGENT: ${{ inputs.agent }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref="$(jq -r '.workflow_sha // empty' <<<"$JOB_CONTEXT")"
          if [ -z "$ref" ]; then
            echo "::error::job.workflow_sha is empty; this workflow needs GitHub.com, where a called workflow knows its own commit"
            exit 1
          fi
          raw="https://raw.githubusercontent.com/segfaultpw/sre-agent-opencode"
          base="${raw}/${ref}"
          # A caller pinned at an annotated tag, such as @v1 or @v1.0.0, gets
          # that tag object's sha here, and the raw host serves commits only.
          # Dereferencing it costs one API call, and only in that case.
          if ! curl -fsSL "$base/VERSION" -o /tmp/sre-agent-VERSION; then
            commit="$(gh api "repos/segfaultpw/sre-agent-opencode/git/tags/${ref}" --jq '.object.sha' 2>/dev/null || true)"
            if [ -z "$commit" ]; then
              echo "::error::the package's files are not at ${ref}; it is neither a commit nor a tag of segfaultpw/sre-agent-opencode"
              exit 1
            fi
            echo "resolved the annotated tag ${ref} to commit ${commit}"
            ref="$commit"
            base="${raw}/${ref}"
            curl -fsSL "$base/VERSION" -o /tmp/sre-agent-VERSION
          fi
          version="$(tr -d '[:space:]' < /tmp/sre-agent-VERSION)"
          curl -fsSL "$base/config/opencode.json" -o /tmp/sre-agent-opencode.json
          curl -fsSL "$base/agents/sre-fix.md" -o /tmp/sre-agent-agent.md
          curl -fsSL "$base/scripts/provider_env.sh" -o /tmp/sre-agent-provider_env.sh
          curl -fsSL "$base/scripts/protected_paths.sh" -o /tmp/sre-agent-protected_paths.sh
          curl -fsSL "$base/scripts/run_prs.sh" -o /tmp/sre-agent-run_prs.sh
          curl -fsSL "$base/scripts/decline_comment.sh" -o /tmp/sre-agent-decline_comment.sh
          curl -fsSL "$base/scripts/strip_repo_config.sh" -o /tmp/sre-agent-strip_repo_config.sh
          # opencode merges this repository's own configuration with the
          # package's rather than being replaced by it, and the merge keeps the
          # repository's key order, so a tracked opencode.json can hold our
          # denies at its own positions and let its catch-all win. What it
          # loads out of .opencode/ is worse: a plugin runs before any gate,
          # and an agent definition replaces this prompt and its permissions.
          # The whole directory and the root configuration leave the checkout
          # here, and the package's own agent is written into the empty tree
          # below, so what opencode finds is what this workflow put there. A
          # repository that tracks its own .opencode/agents/sre-fix.md is no
          # longer refused, because it no longer collides with anything.
          bash /tmp/sre-agent-strip_repo_config.sh .
          mkdir -p .opencode/agents
          sed "s/{{SRE_AGENT_OPENCODE_VERSION}}/v${version}/g" /tmp/sre-agent-agent.md > .opencode/agents/sre-fix.md
          echo ".opencode/" >> .git/info/exclude
          config="$(jq -c --arg agent "$AGENT" '.default_agent = $agent' /tmp/sre-agent-opencode.json)"
          {
            echo "OPENCODE_CONFIG_CONTENT=${config}"
            echo "SRE_AGENT_OPENCODE_VERSION=v${version}"
            echo "SRE_AGENT_RUN_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"
          echo "installed sre-agent-opencode v${version} from ${ref} with agent ${AGENT}"

      # GitHub evaluates expressions in env values, never in env names, so the
      # secret cannot be mapped in the action's env block; it is exported into
      # the job under the provider's own variable instead. The value is a
      # registered secret, so the log masks it.
      - name: Name the provider secret
        shell: bash
        env:
          MODEL: ${{ inputs.model }}
          PROVIDER_KEY: ${{ secrets.provider_key }}
        run: |
          set -euo pipefail
          var="$(bash /tmp/sre-agent-provider_env.sh "$MODEL")"
          if [ -z "$PROVIDER_KEY" ]; then
            echo "::error::the provider_key secret is empty; pass the ${var} secret of this repository"
            exit 1
          fi
          {
            echo "${var}<<__SRE_AGENT_EOF__"
            echo "$PROVIDER_KEY"
            echo "__SRE_AGENT_EOF__"
          } >> "$GITHUB_ENV"
          echo "provider_key exported as ${var} for ${MODEL}"

      # The action configures a git identity only in App mode; in token mode
      # the commit fails with "empty ident name" after the agent has done its
      # work. This is the identity GitHub attributes to GITHUB_TOKEN, so the
      # pull request author stays github-actions[bot]. It runs in token mode
      # only: a local identity takes precedence over the global one the action
      # sets in App mode and would change who authors those commits.
      - name: Give the token an identity
        if: ${{ inputs.use_github_token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "commit identity set to github-actions[bot] for token mode"

      # A run the relay dispatched has no comment and no issue in its event,
      # so the action's prompt is mandatory there and the brief is the issue's
      # own body. The title and the body are read here as well: the marking
      # and decline steps take the card key and the marker line from them, and
      # this door's event carries neither.
      - name: Read the brief from the issue
        id: brief
        if: ${{ github.event_name == 'workflow_dispatch' && env.ISSUE_NUMBER != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Anyone with write access can dispatch this workflow from the
          # Actions tab and type whatever they like into the input.
          if [[ ! "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::issue_number must be a number; this run was dispatched with '${ISSUE_NUMBER}'"
            exit 1
          fi
          issue="$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json title,body)"
          title="$(jq -r '.title // ""' <<<"$issue")"
          body="$(jq -r '.body // ""' <<<"$issue")"
          # The issue carries text an attacker can write, so each value leaves
          # this step behind a delimiter that text cannot guess and therefore
          # cannot close early.
          eof="SRE_AGENT_EOF_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "title<<${eof}"
            printf '%s\n' "$title"
            echo "$eof"
            echo "body<<${eof}"
            printf '%s\n' "$body"
            echo "$eof"
            echo "prompt<<${eof}"
            echo "The text below is the brief. Follow its contract."
            echo
            printf '%s\n' "$body"
            echo "$eof"
          } >> "$GITHUB_OUTPUT"
          echo "read the brief from issue #${ISSUE_NUMBER}"

      # Pinned to a release tag: anomalyco/opencode has no major tag, only
      # releases and a moving "latest". Bumps go through the CHANGELOG, and a
      # bump has one more thing to check: a run dispatched by the relay finds
      # its own pull request by the run link the action ends every body with,
      # "[github run](/owner/repo/actions/runs/<id>)". A release that changes
      # that shape leaves every dispatched run marking nothing, which the
      # marking step reports as a warning rather than as a failure.
      - name: Run opencode
        id: opencode
        if: ${{ !inputs.dry_run }}
        uses: anomalyco/opencode/github@v1.18.29
        env:
          GITHUB_TOKEN: ${{ secrets.token || github.token }}
        with:
          model: ${{ inputs.model }}
          agent: ${{ inputs.agent }}
          prompt: ${{ inputs.prompt != '' && inputs.prompt || steps.brief.outputs.prompt }}
          variant: ${{ inputs.variant }}
          share: false
          use_github_token: ${{ inputs.use_github_token }}

      # A separate failure-only step, because the steps below never run when
      # the action fails, and the action's own report, where the run had a
      # comment to answer, is a comment on the issue rather than a line in the
      # log. The commonest token-mode failure is a repository policy, which
      # the log alone does not explain.
      - name: Explain a refused pull request
        if: ${{ failure() && steps.opencode.outcome == 'failure' && inputs.use_github_token && env.ISSUE_NUMBER != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          comments="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=10" --jq '.[].body' || true)"
          if grep -qF "GitHub Actions is not permitted to create or approve pull requests" <<<"$comments"; then
            echo "::error::the branch was pushed but the pull request was refused by policy. Enable 'Allow GitHub Actions to create and approve pull requests' for this repository, and for the organization when the organization restricts it: gh api -X PUT repos/${GITHUB_REPOSITORY}/actions/permissions/workflow -f default_workflow_permissions=read -F can_approve_pull_request_reviews=true (and the same for orgs/<org>/actions/permissions/workflow). The opencode App identity needs none of this."
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "::warning::opencode failed in token mode; a dispatched run gets no comment on the issue, so the reason is in this run's log alone"
          else
            echo "::warning::opencode failed in token mode; the action reports the reason as a comment on issue #${ISSUE_NUMBER} and the details are in this run's log"
          fi

      # The fences in the configuration are opencode's own tool gates, and the
      # agent also runs a shell, which can write a file without any tool. The
      # pull request's file list is what actually pushed, so it is judged here,
      # after the action, where nothing the agent does can walk around it: a
      # pull request that touched .github/, an env file, a secrets path or a
      # key is closed with a comment and the job fails.
      #
      # Every candidate is inspected and closed, this run's own or another
      # dispatched run's, because a pull request that touched a protected path
      # has to be closed whichever run opened it. Only the verdict is this
      # run's: failing on another run's pull request would fail this run and
      # leave its own work unmarked, and the platform would record a request
      # that succeeded as failed.
      - name: Close a pull request that touched a protected path
        if: ${{ !inputs.dry_run && env.ISSUE_NUMBER != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The lookup's exit status is the gate's first verdict: a failed
          # listing must fail the job, not read as "no pull requests".
          if ! bash /tmp/sre-agent-run_prs.sh > "$RUNNER_TEMP/prs.jsonl"; then
            echo "::error::could not list this run's pull requests; failing rather than leaving one uninspected"
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/prs.jsonl" ]; then
            echo "no pull request opened by this run on issue #${ISSUE_NUMBER}"
            exit 0
          fi
          failed=0
          while IFS= read -r -u 9 pr; do
            number="$(jq -r '.number' <<<"$pr")"
            files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}/files" --paginate --jq '.[].filename')"
            flagged=""
            if flagged="$(bash /tmp/sre-agent-protected_paths.sh <<<"$files")"; then
              echo "pull request #${number} changed no protected path"
              continue
            fi
            list="$(paste -sd ',' <<<"$flagged" | sed 's/,/, /g')"
            if [ "$(jq -r '.mine' <<<"$pr")" = true ]; then
              gh pr comment "$number" --repo "$GITHUB_REPOSITORY" --body "Closed by the SRE Agent fix runner: it changed a protected path (${list})"
              gh pr close "$number" --repo "$GITHUB_REPOSITORY"
              echo "::error::pull request #${number} changed a protected path (${list}) and was closed"
              failed=1
            else
              # The run that opened it is closing it too, so losing that race
              # is not this run's failure and must not become its verdict.
              gh pr comment "$number" --repo "$GITHUB_REPOSITORY" --body "Closed by the SRE Agent fix runner: it changed a protected path (${list})" || true
              gh pr close "$number" --repo "$GITHUB_REPOSITORY" || true
              echo "::warning::pull request #${number} was opened by another run of this repository; it changed a protected path (${list}) and was closed, and this run's verdict is unaffected"
            fi
          done 9< "$RUNNER_TEMP/prs.jsonl"
          exit "$failed"

      # The action opens the pull request itself, from a branch it names, with
      # a title of its own and the agent's answer as the body. The platform's
      # contract (a draft, the card key first in the title, the marker and the
      # version stamp somewhere in the body) is applied here so it never
      # depends on the model obeying its prompt. The issue's text reaches the
      # script only through the environment. Draft pull requests need a plan
      # that supports them, so the conversion is allowed to fail with a warning
      # rather than fail a run whose pull request is already open.
      - name: Mark the pull request for SRE Agent
        id: mark
        if: ${{ !inputs.dry_run && env.ISSUE_NUMBER != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: ${{ steps.brief.outputs.title != '' && steps.brief.outputs.title || github.event.issue.title }}
          ISSUE_BODY: ${{ steps.brief.outputs.body != '' && steps.brief.outputs.body || github.event.issue.body }}
        run: |
          set -euo pipefail
          key="$(grep -oE '^[A-Z][A-Z0-9]*-[0-9]+' <<<"$ISSUE_TITLE" || true)"
          marker="$(grep -oE '<!-- sre-agent:remediation:[^>]*-->' <<<"$ISSUE_BODY" | head -n 1 || true)"
          stamp="<!-- sre-agent-opencode:${SRE_AGENT_OPENCODE_VERSION} -->"
          [ -n "$key" ] || echo "no card key at the start of the issue title; the title is left as the action wrote it"
          [ -n "$marker" ] || echo "no marker line in the issue body; the body gets the version stamp only"
          if ! bash /tmp/sre-agent-run_prs.sh > "$RUNNER_TEMP/candidates.jsonl"; then
            echo "::error::could not list this run's pull requests; failing rather than leaving one unmarked"
            exit 1
          fi
          # Only this run's own: marking another dispatched run's pull request
          # would put this run's card key and marker line on it, and the
          # platform would adopt the wrong one.
          jq -c 'select(.mine)' "$RUNNER_TEMP/candidates.jsonl" > "$RUNNER_TEMP/prs.jsonl"
          # The count is this step's verdict on which outcome the run had, and
          # the decline step reads it: a run that opened a pull request has
          # nothing to mark on the issue.
          if [ ! -s "$RUNNER_TEMP/prs.jsonl" ]; then
            echo "pull_requests=0" >> "$GITHUB_OUTPUT"
            if [ -s "$RUNNER_TEMP/candidates.jsonl" ]; then
              echo "::warning::$(grep -c '' "$RUNNER_TEMP/candidates.jsonl") pull request(s) were opened on a dispatch branch while this run was going and none of them links this run, so none was marked. A run link the action stopped writing would look exactly like this."
            fi
            echo "no pull request opened by this run on issue #${ISSUE_NUMBER}"
            exit 0
          fi
          echo "pull_requests=$(grep -c '' "$RUNNER_TEMP/prs.jsonl")" >> "$GITHUB_OUTPUT"
          while IFS= read -r -u 9 pr; do
            number="$(jq -r '.number' <<<"$pr")"
            title="$(jq -r '.title' <<<"$pr")"
            body="$(jq -r '.body' <<<"$pr")"
            draft="$(jq -r '.isDraft' <<<"$pr")"
            args=()
            if [ -n "$key" ] && [[ "$title" != "$key"* ]]; then
              args+=(--title "${key}: ${title}")
            fi
            tail=""
            if [ -n "$marker" ] && [[ "$body" != *"$marker"* ]]; then
              tail="${tail}${marker}"$'\n'
            fi
            if [[ "$body" != *"$stamp"* ]]; then
              tail="${tail}${stamp}"$'\n'
            fi
            if [ -n "$tail" ]; then
              args+=(--body "${body}"$'\n\n'"${tail}")
            fi
            if [ "${#args[@]}" -gt 0 ]; then
              gh pr edit "$number" --repo "$GITHUB_REPOSITORY" "${args[@]}"
            fi
            if [ "$draft" != "true" ]; then
              gh pr ready "$number" --repo "$GITHUB_REPOSITORY" --undo \
                || echo "::warning::could not convert #${number} to a draft; draft pull requests need a plan that supports them"
            fi
            echo "marked pull request #${number} for SRE Agent"
          done 9< "$RUNNER_TEMP/prs.jsonl"

      # A dispatched run has no comment to answer on and the action posts
      # nothing on the issue for one, so the decline that would have carried
      # the agent's own words is written here instead. The platform ends a
      # request on a comment beginning "Declined:" written by this token's
      # identity, which is what the shape below is; only the reason is
      # generic, because the action exposes the agent's answer nowhere but the
      # run's log, and the comment links it. The step after this one appends
      # the marker line and the version stamp, exactly as it does to the
      # action's own decline on the comment door.
      - name: Decline on the issue when the run opened no pull request
        if: ${{ !inputs.dry_run && github.event_name == 'workflow_dispatch' && env.ISSUE_NUMBER != '' && steps.mark.outputs.pull_requests == '0' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Declined: the run opened no pull request; the agent's answer is in the run log ${run_url}"
          echo "declined on issue #${ISSUE_NUMBER} with a link to this run"

      # A decline is the run's other ending: no pull request, and the agent's
      # answer posted as a comment beginning "Declined:". SRE Agent ends the
      # remediation row the marker names, so the comment carries the same
      # marker the pull request body would have carried; without it a decline
      # that lands after the request was superseded ends the newest dispatched
      # row instead, which is the wrong one. It runs only when the marking
      # step found no pull request, so a run never both delivers one and
      # declines.
      - name: Mark the decline comment for SRE Agent
        if: ${{ !inputs.dry_run && env.ISSUE_NUMBER != '' && steps.mark.outputs.pull_requests == '0' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_BODY: ${{ steps.brief.outputs.body != '' && steps.brief.outputs.body || github.event.issue.body }}
        run: bash /tmp/sre-agent-decline_comment.sh
