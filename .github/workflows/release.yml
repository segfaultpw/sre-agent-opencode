name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# The runner switch, as in ci.yml: an unset variable falls back to the
# Blacksmith label and changes nothing.
jobs:
  # The tag check gates everything, image included: an image tagged v1.2.0 and
  # built from a tree whose VERSION says something else would stamp pull
  # requests with a version that does not exist.
  check:
    name: check the tag
    runs-on: ${{ vars.RUNNER_X64 || 'blacksmith-4vcpu-ubuntu-2404' }}
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
      major: ${{ steps.tag.outputs.major }}
    steps:
      - uses: actions/checkout@v6

      - name: Check the tag against VERSION
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::tag ${TAG} does not match VERSION ${version}"
            exit 1
          fi
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "major=${TAG%%.*}" >> "$GITHUB_OUTPUT"

  # One tag per architecture, merged below. Both are built on a runner of that
  # architecture, the way the platform repository builds its own images.
  image:
    name: runner image ${{ matrix.suffix }}
    needs: check
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ${{ vars.RUNNER_X64 || 'blacksmith-4vcpu-ubuntu-2404' }}
            suffix: amd64
          - platform: linux/arm64
            runner: ${{ vars.RUNNER_ARM64 || 'blacksmith-4vcpu-ubuntu-2404-arm' }}
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.suffix }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: runner/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sre-agent-opencode-runner:${{ github.ref_name }}-${{ matrix.suffix }}

  image-manifest:
    name: runner image manifest
    needs: [check, image]
    runs-on: ${{ vars.RUNNER_X64 || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # imagetools retags by manifest reference, so the multi-architecture tag
      # points at the images that were just built rather than at a rebuild.
      - name: Merge the per-architecture images into one manifest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/sre-agent-opencode-runner
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "$IMAGE:$TAG" \
            "$IMAGE:$TAG-amd64" \
            "$IMAGE:$TAG-arm64"
          docker buildx imagetools inspect "$IMAGE:$TAG"

      # The moving major is what an operator following "the current v1" pulls,
      # so a prerelease leaves it where it is, exactly as the git tag does.
      - name: Move the moving major image tag
        if: needs.check.outputs.prerelease != 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/sre-agent-opencode-runner
          TAG: ${{ github.ref_name }}
          MAJOR: ${{ needs.check.outputs.major }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "$IMAGE:$MAJOR" "$IMAGE:$TAG"
          echo "${IMAGE}:${MAJOR} now points at ${TAG}"

  # Last, so a release never announces a version whose image failed to build.
  release:
    name: release ${{ github.ref_name }}
    needs: [check, image-manifest]
    runs-on: ${{ vars.RUNNER_X64 || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Cut the release notes from the CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/changelog_section.sh CHANGELOG.md "$TAG" > notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--title "$TAG" --notes-file notes.md --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}"

      # The major tag follows every release of that major, so a customer
      # pinned to @v1 receives fixes. A prerelease does not move it.
      - name: Move the major tag
        if: needs.check.outputs.prerelease == 'false'
        env:
          TAG: ${{ github.ref_name }}
          MAJOR: ${{ needs.check.outputs.major }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Point the major tag at the commit, not at the release's annotated
          # tag object: a caller pinned at the major gets that sha as
          # job.workflow_sha, and only a commit is fetchable from the raw host.
          git tag -f "$MAJOR" "${TAG}^{commit}"
          git push -f origin "$MAJOR"
          echo "${MAJOR} now points at $(git rev-parse "${TAG}^{commit}")"
