name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Every runs-on below reads the organization's runner switch
# (segfaultpw/runner-switch), which sets RUNNER_X64 and RUNNER_ARM64 to
# GitHub-hosted labels while the month's included Actions minutes last and to
# Blacksmith labels once they are nearly spent. The fallback in each expression
# is the Blacksmith label, so an unset variable changes nothing. fix.yml is
# deliberately not part of this: it runs in a customer's repository, where
# these variables do not exist, and its runner input defaults to a label
# GitHub itself provides.
jobs:
  lint:
    name: actionlint
    runs-on: ${{ vars.RUNNER_X64 || 'blacksmith-4vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@v6
      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
      - name: Lint the workflows and the example
        run: ./actionlint -color .github/workflows/*.yml examples/opencode.yml

  tests:
    name: config, provider mapping and changelog tests
    runs-on: ${{ vars.RUNNER_X64 || 'blacksmith-4vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@v6
      - run: bash tests/config_test.sh
      - run: bash tests/workflow_test.sh
      - run: bash tests/pattern_probe_test.sh
      - run: bash tests/provider_env_test.sh
      - run: bash tests/protected_paths_test.sh
      - run: bash tests/strip_repo_config_test.sh
      - run: bash tests/gate_agreement_test.sh
      - run: bash tests/run_prs_test.sh
      - run: bash tests/decline_comment_test.sh
      - run: bash tests/install_test.sh
      - run: bash tests/changelog_section_test.sh
      - run: bash tests/conventional_title_test.sh
      - run: bash tests/card_key_test.sh
      - run: bash tests/pr_body_test.sh
      # The runner is the only Node file in the package, so its syntax gate is
      # the one lint it gets; the test that follows runs it for real against a
      # fixture platform.
      - run: node --check runner/runner.js
      - run: node --check runner/conventional_title.js
      - run: node --check runner/memory.js
      - run: node --check runner/bucket.js
      - run: node --check runner/github_app.js
      - run: node tests/memory_test.js
      - run: node tests/bundle_test.js
      - run: node tests/agent_home_test.js
      - run: node tests/github_app_test.js
      - run: bash tests/runner_test.sh
      - run: bash tests/bucket_test.sh
      - run: bash tests/secret_trim_test.sh
      - run: bash tests/uid_split_ci_test.sh
      - run: bash tests/image_test.sh
      - run: bash tests/install_runner_test.sh

  # Root is needed to switch uids, so this one runs where passwordless sudo
  # exists. The test itself fails, rather than skips, when it runs in CI and
  # cannot switch uids, and the two success lines are asserted here as well so a
  # run that printed nothing cannot pass.
  uid-split:
    name: the agent runs as its own account
    runs-on: ${{ vars.RUNNER_X64 || 'blacksmith-4vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@v6
      - name: This runner has passwordless sudo
        run: sudo -n true
      - name: Prove the split with real uids
        run: |
          set -o pipefail
          bash tests/uid_split_test.sh | tee "$RUNNER_TEMP/uid_split.out"
          grep -qxF 'ok   root: the request ends in a pull request' "$RUNNER_TEMP/uid_split.out"
          grep -qxF 'ok   caps: the request ends in a pull request' "$RUNNER_TEMP/uid_split.out"
          if grep -q '^FAIL\|^SKIP' "$RUNNER_TEMP/uid_split.out"; then exit 1; fi

  dry-run:
    name: opencode loads the config and the agent
    runs-on: ${{ vars.RUNNER_X64 || 'blacksmith-4vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@v6
      - name: Install opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - run: opencode --version
      - run: bash tests/dry_run_test.sh

  # The image is built on every push and pull request and published only from a
  # release tag. A Dockerfile that built for the first time at release time
  # would be found broken at the one moment there is no room to fix it.
  runner-image:
    name: runner image ${{ matrix.suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each architecture on a runner of that architecture. The image
          # installs a prebuilt opencode, kubectl, gh and AWS CLI per
          # architecture, so an emulated build would take far longer and prove
          # less than a native one.
          - platform: linux/amd64
            runner: ${{ vars.RUNNER_X64 || 'blacksmith-4vcpu-ubuntu-2404' }}
            suffix: amd64
          - platform: linux/arm64
            runner: ${{ vars.RUNNER_ARM64 || 'blacksmith-4vcpu-ubuntu-2404-arm' }}
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build the runner image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: runner/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          # Into the local daemon, so the checks below run the image that was
          # just built rather than reading the Dockerfile a second time.
          load: true
          tags: sre-agent-opencode-runner:ci

      - name: The image carries what the runner shells out to
        env:
          IMAGE: sre-agent-opencode-runner:ci
        run: |
          set -euo pipefail
          # The image starts as root: the runner needs it to start every agent
          # run as the agent's account (runner/Dockerfile, USER root). So the
          # default is asserted as exactly that, and the checks about what the
          # agent can do run as the agent; as root, "not root" and "cannot write
          # the fences" are both false whatever the file modes say.
          user="$(docker inspect -f '{{.Config.User}}' "$IMAGE")"
          if [ "$user" != "root" ]; then
            echo "::error::the image's default user is '${user}', and the runner needs root to start the agent as its own account"
            exit 1
          fi
          # HOME is a directory the agent can write: its own home, /workspace/agent-home,
          # is made by the runner when it starts, and opencode wants to write under HOME.
          docker run --rm --user agent -e HOME=/tmp --entrypoint bash "$IMAGE" -c '
            set -eux
            node --version
            git --version
            gh --version
            opencode --version
            kubectl version --client
            aws --version
            test "$(id -u)" -eq 10002
            node --check /opt/sre-agent-opencode/runner/runner.js
            node --check /opt/sre-agent-opencode/runner/conventional_title.js
            node --check /opt/sre-agent-opencode/runner/memory.js
            node --check /opt/sre-agent-opencode/runner/bucket.js
            node --check /opt/sre-agent-opencode/runner/github_app.js
            # Every file the runner reads out of the package at run time. A
            # build context rule that excluded one of these would produce an
            # image that builds and then fails its first job.
            test -s /opt/sre-agent-opencode/VERSION
            test -s /opt/sre-agent-opencode/agents/sre-fix.md
            test -s /opt/sre-agent-opencode/config/opencode.json
            test -s /opt/sre-agent-opencode/scripts/protected_paths.sh
            # The agent runs under this account and must not be able to edit
            # the fences the next run will load.
            ! test -w /opt/sre-agent-opencode/config/opencode.json
          '

      - name: The stamp the image writes is its own version
        env:
          IMAGE: sre-agent-opencode-runner:ci
        run: |
          set -euo pipefail
          in_image="$(docker run --rm --entrypoint cat "$IMAGE" /opt/sre-agent-opencode/VERSION | tr -d '[:space:]')"
          in_tree="$(tr -d '[:space:]' < VERSION)"
          if [ "$in_image" != "$in_tree" ]; then
            echo "::error::the image carries VERSION ${in_image} and the tree says ${in_tree}"
            exit 1
          fi
          echo "the image carries VERSION ${in_image}"

      - name: The image refuses to start without its configuration
        env:
          IMAGE: sre-agent-opencode-runner:ci
        run: |
          set -euo pipefail
          if out="$(docker run --rm "$IMAGE" 2>&1)"; then
            echo "::error::the runner started with no configuration"
            exit 1
          fi
          echo "$out"
          for name in SRE_SERVER_URL SRE_API_KEY SRE_MODEL; do
            if ! grep -qF "${name} is not set" <<<"$out"; then
              echo "::error::the refusal did not name ${name}"
              exit 1
            fi
          done

      # A start, not a refusal: the image has to reach its first poll. The poll
      # goes to a refused local port, so nothing leaves the job and no secret is
      # involved. Three starts: Docker's defaults (root with the six capabilities
      # the account split takes); the way the earlier Kubernetes manifest starts
      # it, as the runner's own uid with every capability dropped, which has to
      # fall back to one account with a sentence and still poll, never crash on a
      # chown; and root with every capability dropped, which has to refuse.
      - name: The image starts the runner and reaches its first poll
        env:
          IMAGE: sre-agent-opencode-runner:ci
        run: |
          set -euo pipefail
          start() {
            local label="$1"
            shift
            local id
            id="$(docker run -d "$@" -e SRE_SERVER_URL=http://127.0.0.1:9 -e SRE_API_KEY=not-a-real-key -e SRE_MODEL=openrouter/deepseek/deepseek-v4-pro "$IMAGE")"
            for _ in $(seq 1 80); do
              if docker logs "$id" 2>&1 | grep -q 'polling http://127.0.0.1:9'; then break; fi
              sleep 0.25
            done
            docker logs "$id" > "$RUNNER_TEMP/${label}.log" 2>&1 || true
            docker rm -f "$id" > /dev/null
            cat "$RUNNER_TEMP/${label}.log"
          }
          start default
          grep -q 'polling http://127.0.0.1:9, running as root, starting the agent as uid 10002 and git as uid 10001' "$RUNNER_TEMP/default.log" || { echo "::error::the default start did not reach its first poll with the account split"; exit 1; }
          start nocaps --user 10001:10001 --cap-drop ALL
          grep -q 'polling http://127.0.0.1:9' "$RUNNER_TEMP/nocaps.log" || { echo "::error::a start without capabilities did not reach its first poll"; exit 1; }
          grep -q 'the agent account split is off' "$RUNNER_TEMP/nocaps.log" || { echo "::error::a start without capabilities did not say that the split is off"; exit 1; }
          if grep -qi 'EPERM\|operation not permitted' "$RUNNER_TEMP/nocaps.log"; then echo "::error::a start without capabilities failed on a chown or a chmod"; exit 1; fi
          # Root without the capabilities is the one start that must NOT fall back:
          # one account there is root. It refuses, naming what is missing. The
          # workspace is a world-writable tmpfs so that the entrypoint's own
          # writability check (root has no DAC_OVERRIDE here) does not answer first.
          if out="$(docker run --rm --tmpfs /workspace:rw,mode=0777 --cap-drop ALL -e SRE_SERVER_URL=http://127.0.0.1:9 -e SRE_API_KEY=not-a-real-key -e SRE_MODEL=openrouter/deepseek/deepseek-v4-pro "$IMAGE" 2>&1)"; then
            echo "::error::root without capabilities started"
            exit 1
          fi
          echo "$out"
          grep -q 'the agent would run as root, so the runner will not start' <<<"$out" || { echo "::error::root without capabilities was refused for another reason"; exit 1; }
          if grep -q 'polling' <<<"$out"; then echo "::error::root without capabilities reached a poll"; exit 1; fi

  # The reusable workflow called the way a customer calls it, stopped after
  # the install and the secret mapping: proof on GitHub itself that a called
  # workflow resolves its own commit and fetches the package's files at it.
  # A pull request's merge commit is not fetchable from raw.githubusercontent.com,
  # so this runs on pushes only.
  smoke:
    name: reusable workflow dry run
    if: github.event_name == 'push'
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/fix.yml
    with:
      model: openrouter/deepseek/deepseek-v4-pro
      use_github_token: true
      dry_run: true
    secrets:
      provider_key: not-a-key-the-dry-run-stops-before-opencode
